server.port=8088
spring.datasource.url=jdbc:mysql://localhost:3306/rta_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MySql_0831MySql_0831
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Kafka consumer (adjust bootstrap-servers and topic as needed)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=rta-upload-subsystem
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=rta.kafka.MerchantCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Topic for merchant-created events from main system
rta.kafka.topic.merchant-created=rta-merchant-created
